name: OSU Seat Watcher

on:
  schedule:
    # Checks every 10 minutes (UTC). GitHub may delay queued runs by 2-5 min at peak times.
    - cron: "*/10 * * * *"
  workflow_dispatch: # Enables 1-click manual runs in the Actions tab

permissions:
  contents: read

jobs:
  check-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run seat watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 seat_watcher.py
