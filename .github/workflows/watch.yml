name: OSU Seat Watcher

on:
  schedule:
    # Runs at :04, :14, :24, :34, :44, :54 to avoid :00/:10 global traffic spikes
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: # Enables 1-click manual runs in the Actions tab

permissions:
  contents: read

jobs:
  check-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run seat watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 seat_watcher.py
