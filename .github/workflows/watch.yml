name: OSU Seat Watcher

on:
  schedule:
    # Runs every 5 minutes (GitHub's fastest allowed interval) on off-peak minutes
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: # Enables 1-click manual runs in the Actions tab

permissions:
  contents: read

jobs:
  check-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run seat watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 seat_watcher.py
